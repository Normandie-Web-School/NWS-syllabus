<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programmes de formation â€” Normandie Web School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fugaz+One&family=Fira+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red:    #e94a34;
      --teal:   #00a5a5;
      --navy:   #1c1b3b;
      --dark:   #1a1a2e;
      --gray:   #6b7280;
      --light:  #f4f5f7;
      --white:  #ffffff;
      --border: #e5e7eb;
      --type-cours:    #00a5a5;
      --type-projet:   #e94a34;
      --type-atelier:  #f59e0b;
      --type-eval:     #1c1b3b;
      --type-stage:    #3db166;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Fira Sans', sans-serif;
      background: var(--light);
      color: var(--dark);
      min-height: 100vh;
    }

    /* â”€â”€ HEADER â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2.5rem;
      height: 58px;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 1px 0 var(--border), 0 2px 8px rgba(0,0,0,0.04);
    }

    .logo { display: flex; align-items: center; text-decoration: none; }
    .logo svg { height: 28px; width: auto; }

    .header-right { display: flex; align-items: center; gap: 0.9rem; }
    .header-divider { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
    .header-label { font-size: 0.78rem; font-weight: 500; color: var(--gray); letter-spacing: 0.01em; }
    .header-label strong { color: var(--navy); font-weight: 600; }

    .today-badge {
      font-size: 0.69rem;
      font-weight: 600;
      padding: 0.22rem 0.7rem;
      border-radius: 999px;
      background: rgba(233,74,52,0.09);
      color: var(--red);
      letter-spacing: 0.02em;
      white-space: nowrap;
      border: 1px solid rgba(233,74,52,0.18);
    }

    /* â”€â”€ TABS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .tabs-wrapper {
      background: var(--navy);
      position: sticky;
      top: 58px;
      z-index: 100;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .tabs-wrapper::-webkit-scrollbar { height: 2px; }
    .tabs-wrapper::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }

    .tabs {
      display: flex;
      align-items: stretch;
      padding: 0 2rem;
      min-width: max-content;
    }

    .tab-group { display: flex; align-items: stretch; }

    .tab-group-label {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      padding: 0 0.75rem;
      display: flex;
      align-items: center;
      border-right: 1px solid rgba(255,255,255,0.06);
      user-select: none;
      white-space: nowrap;
    }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: rgba(255,255,255,0.4);
      padding: 0 0.95rem;
      height: 46px;
      font-family: 'Fira Sans', sans-serif;
      font-size: 0.77rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.14s, border-color 0.14s;
    }
    .tab-btn:hover { color: rgba(255,255,255,0.78); }
    .tab-btn.active { color: white; border-bottom-color: var(--red); }

    .tab-vsep { width: 1px; background: rgba(255,255,255,0.07); margin: 10px 2px; flex-shrink: 0; }

    /* â”€â”€ MAIN â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 2rem 5rem;
    }

    .formation-panel { display: none; }
    .formation-panel.active { display: block; animation: fadeIn 0.2s ease; }

    @keyframes fadeIn {
      from { opacity:0; transform:translateY(5px); }
      to   { opacity:1; transform:translateY(0);   }
    }

    /* â”€â”€ FORMATION HEADER â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .formation-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.25rem;
      padding: 1.4rem 1.75rem;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      border-left: 4px solid var(--red);
    }

    .formation-name {
      font-family: 'Fugaz One', display;
      font-size: 1.65rem;
      color: var(--navy);
      letter-spacing: 0.01em;
      line-height: 1.1;
    }

    .formation-sub { font-size: 0.78rem; color: var(--gray); margin-top: 0.25rem; }

    .formation-badges { display: flex; gap: 0.4rem; margin-top: 0.55rem; flex-wrap: wrap; }

    .badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .badge-navy { background: var(--navy); color: white; }
    .badge-teal { background: rgba(0,165,165,0.1); color: var(--teal); border: 1px solid rgba(0,165,165,0.2); }
    .badge-red  { background: rgba(233,74,52,0.1);  color: var(--red);  border: 1px solid rgba(233,74,52,0.2); }

    .formation-controls { display: flex; flex-direction: column; align-items: flex-end; gap: 0.7rem; }

    /* â”€â”€ VIEW TOGGLE â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .view-toggle {
      display: flex;
      background: var(--light);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .view-btn {
      background: none;
      border: none;
      padding: 0.42rem 0.9rem;
      font-family: 'Fira Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--gray);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.38rem;
      transition: all 0.14s;
    }
    .view-btn.active { background: var(--navy); color: white; }
    .view-btn:not(.active):hover { background: var(--border); }
    .view-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

    /* â”€â”€ STATS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .stats-bar { display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.72rem; color: var(--gray); }
    .stat-item { display: flex; align-items: center; gap: 0.3rem; }
    .stat-dot  { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }

    /* â”€â”€ LIST VIEW â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .modules-list { display: grid; gap: 0.45rem; }

    .module-card {
      background: white;
      border: 1px solid var(--border);
      border-left: 3px solid var(--tc, var(--gray));
      border-radius: 0 8px 8px 0;
      padding: 0.85rem 1.2rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.4rem 1.5rem;
      align-items: start;
      transition: box-shadow 0.14s, transform 0.12s;
    }
    .module-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.07); transform: translateX(2px); }

    .module-header { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .module-title  { font-weight: 600; font-size: 0.88rem; color: var(--dark); }

    .type-tag {
      font-size: 0.61rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.11rem 0.48rem;
      border-radius: 4px;
      color: var(--tc);
      background: color-mix(in srgb, var(--tc) 10%, transparent);
      flex-shrink: 0;
    }

    .module-desc {
      font-size: 0.8rem;
      color: var(--gray);
      font-weight: 300;
      line-height: 1.55;
      margin-top: 0.2rem;
    }

    .module-dates { text-align: right; flex-shrink: 0; white-space: nowrap; }
    .date-main { font-size: 0.75rem; font-weight: 500; color: var(--dark); }
    .date-main .sep { color: var(--red); margin: 0 0.2rem; }
    .date-dur { font-size: 0.67rem; color: var(--gray); margin-top: 0.1rem; font-weight: 300; }

    /* â”€â”€ TIMELINE â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .timeline-view { display: none; }

    .timeline-container {
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .tl-header-row {
      display: grid;
      border-bottom: 2px solid var(--border);
      background: #fafafa;
      position: sticky;
      top: 104px;
      z-index: 10;
    }

    .tl-label-col {
      padding: 0.55rem 1rem;
      font-size: 0.63rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gray);
      border-right: 1px solid var(--border);
    }

    .tl-months-wrap { position: relative; overflow: hidden; }
    .tl-months { display: flex; }

    .tl-month-cell {
      flex: 1;
      text-align: center;
      padding: 0.55rem 0.2rem;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gray);
      border-right: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
    }
    .tl-month-cell:last-child { border-right: none; }
    .tl-month-cell.is-current { color: var(--red); }

    .tl-row {
      display: grid;
      border-bottom: 1px solid var(--border);
      min-height: 30px;
    }
    .tl-row:last-child { border-bottom: none; }
    .tl-row:hover { background: #f9fbff; }

    .tl-name {
      padding: 0.28rem 1rem;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--dark);
      border-right: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      line-height: 1.25;
      word-break: break-word;
    }

    .tl-type-dot { width: 6px; height: 6px; border-radius: 2px; background: var(--tc); flex-shrink: 0; }

    .tl-bar-area {
      position: relative;
      padding: 5px 3px;
      overflow: hidden;
    }

    .tl-gridlines { position: absolute; inset: 0; display: flex; pointer-events: none; }
    .tl-gridline { flex: 1; border-right: 1px solid rgba(0,0,0,0.04); }

    /* TODAY LINE â€” dans chaque row */
    .tl-today-line {
      position: absolute;
      top: 0; bottom: 0;
      width: 2px;
      background: var(--red);
      opacity: 0.75;
      z-index: 4;
      pointer-events: none;
    }

    /* TODAY LINE â€” dans le header (plus subtil) */
    .tl-today-header {
      position: absolute;
      top: 0; bottom: 0;
      width: 2px;
      background: var(--red);
      opacity: 0.4;
      pointer-events: none;
      z-index: 5;
    }

    .tl-bar {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      height: 16px;
      border-radius: 3px;
      background: var(--tc);
      display: flex;
      align-items: center;
      padding: 0 6px;
      font-size: 0.57rem;
      font-weight: 600;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0.87;
      cursor: default;
      z-index: 1;
      transition: opacity 0.12s, height 0.12s;
    }
    .tl-bar:hover { opacity: 1; height: 20px; z-index: 5; }

    /* â”€â”€ CUSTOM TOOLTIP â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    #tl-tooltip {
      position: fixed;
      background: var(--navy);
      color: white;
      padding: 0.65rem 0.95rem;
      border-radius: 8px;
      font-size: 0.75rem;
      line-height: 1.5;
      max-width: 280px;
      pointer-events: none;
      z-index: 9999;
      display: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    #tl-tooltip .tt-title { font-weight: 600; font-size: 0.79rem; margin-bottom: 0.15rem; }
    #tl-tooltip .tt-dates { font-size: 0.67rem; opacity: 0.6; margin-bottom: 0.25rem; }
    #tl-tooltip .tt-desc  { font-size: 0.71rem; opacity: 0.82; font-weight: 300; }

    /* â”€â”€ TYPE COLORS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .tc-cours        { --tc: var(--type-cours);   }
    .tc-projet       { --tc: var(--type-projet);  }
    .tc-atelier      { --tc: var(--type-atelier); }
    .tc-eval         { --tc: var(--type-eval);    }
    .tc-evaluation   { --tc: var(--type-eval);    }
    .tc-valuation    { --tc: var(--type-eval);    }
    .tc-partiel      { --tc: var(--type-eval);    }
    .tc-stage        { --tc: var(--type-stage);   }
    .tc-admin        { --tc: #9ca3af;             }
    .tc-accompagement{ --tc: #9ca3af;             }

    /* â”€â”€ EMPTY / LOADING â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .empty { text-align: center; padding: 4rem 2rem; color: var(--gray); }
    .empty p { font-size: 0.85rem; line-height: 1.6; }

    .spinner {
      width: 28px; height: 28px;
      border: 2.5px solid var(--border);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* â”€â”€ FOOTER â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    footer {
      background: var(--navy);
      color: rgba(255,255,255,0.25);
      text-align: center;
      padding: 1.2rem;
      font-size: 0.68rem;
      letter-spacing: 0.04em;
    }

    /* â”€â”€ RESPONSIVE â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    @media (max-width: 640px) {
      header { padding: 0 1rem; }
      .tabs  { padding: 0 1rem; }
      main   { padding: 1.25rem 1rem 3rem; }
      .module-card { grid-template-columns: 1fr; }
      .module-dates { text-align: left; }
      .today-badge, .header-divider, .header-label { display: none; }
      .tl-name { width: 110px !important; font-size: 0.65rem; }
      .tl-label-col { width: 110px !important; }
    }
  </style>
</head>
<body>

<!-- Tooltip -->
<div id="tl-tooltip">
  <div class="tt-title"></div>
  <div class="tt-dates"></div>
  <div class="tt-desc"></div>
</div>

<!-- Header -->

  </a>
  <div class="header-right">
    <div class="header-divider"></div>
    <span class="header-label">Programmes de <strong>formation</strong></span>
    <div class="header-divider"></div>
    <span class="today-badge" id="today-badge"></span>
  </div>
</header>

<!-- Tabs -->
<div class="tabs-wrapper">
  <div class="tabs" id="tabs-nav"></div>

<script>
// â”€â”€ CONFIG â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const BASE = 'https://docs.google.com/spreadsheets/d/1SMWsb0or1m-Jza0N2TuUZ4HkQdFDuoMvF-RvbBpaxpU/gviz/tq?tqx=out:csv&sheet=';

const SHEETS_CONFIG = [
  { id:'a1',     label:'AnnÃ©e 1',      niveau:'Tronc commun', group:'A1', csvUrl: BASE+'A1' },
  { id:'a2-dw',  label:'Dev Web',      niveau:'BAC+2',        group:'A2', csvUrl: BASE+'A2%20DW' },
  { id:'a2-cg',  label:'Comm. Graph',  niveau:'BAC+2',        group:'A2', csvUrl: BASE+'A2%20CG' },
  { id:'a2-cmd', label:'C&MD',         niveau:'BAC+2',        group:'A2', csvUrl: BASE+'A2%20C%26MD' },
  { id:'a3-dw',  label:'Dev Web',      niveau:'BAC+3',        group:'A3', csvUrl: BASE+'A3%20DW' },
  { id:'a3-cg',  label:'Comm. Graph',  niveau:'BAC+3',        group:'A3', csvUrl: BASE+'A3%20CG' },
  { id:'a3-cmd', label:'C&MD',         niveau:'BAC+3',        group:'A3', csvUrl: BASE+'A3%20C%26MD' },

  { id:'a5-dw',  label:'Dev Web',      niveau:'BAC+5',        group:'A5', csvUrl: BASE+'A5%20DW' },
  { id:'a5-cg',  label:'Comm. Graph',  niveau:'BAC+5',        group:'A5', csvUrl: BASE+'A5%20CG' },
  { id:'a5-cmd', label:'C&MD',         niveau:'BAC+5',        group:'A5', csvUrl: BASE+'A5%20C%26MD' },
];

// â”€â”€ TYPES â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const TYPE_DEF = {
  cours:        { label:'Cours',    css:'tc-cours'        },
  projet:       { label:'Projet',   css:'tc-projet'       },
  atelier:      { label:'Atelier',  css:'tc-atelier'      },
  eval:         { label:'Ã‰val.',    css:'tc-eval'         },
  evaluation:   { label:'Ã‰val.',    css:'tc-eval'         },
  partiel:      { label:'Partiel',  css:'tc-partiel'      },
  stage:        { label:'Stage',    css:'tc-stage'        },
  admin:        { label:'Admin',    css:'tc-admin'        },
  accompagement:{ label:'Suivi',    css:'tc-accompagement'},
};

function normType(t){ return (t||'cours').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function tdef(t){ return TYPE_DEF[normType(t)] || {label:t, css:'tc-cours'}; }

// â”€â”€ DATE UTILS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function parseDate(s){
  if(!s) return null;
  const clean = s.split(' ')[0];
  const p = clean.split('/');
  if(p.length!==3) return null;
  const d = new Date(`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`);
  return isNaN(d)?null:d;
}
function fmtDate(s){
  const d=parseDate(s);
  return d ? d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}) : 'â€”';
}
function durLabel(s,e){
  const sd=parseDate(s), ed=parseDate(e);
  if(!sd||!ed) return null;
  const days=Math.round((ed-sd)/86400000);
  if(days<=0) return '1 j';
  const w=Math.round(days/7);
  return w<=1 ? `${days+1} j` : `${w} sem.`;
}

function csvParse(text){
  const lines=text.trim().split('\n');
  const headers=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map(line=>{
    const vals=[];
    let cur='', inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){inQ=!inQ;}
      else if(ch===','&&!inQ){vals.push(cur.trim());cur='';}
      else{cur+=ch;}
    }
    vals.push(cur.trim());
    const obj={};
    headers.forEach((h,i)=>{obj[h]=(vals[i]||'').replace(/^"|"$/g,'').trim();});
    return {
      title: obj['IntitulÃ©']||'',
      start: obj['Date dÃ©but']||'',
      end:   obj['Date fin']||'',
      type:  obj['Type']||'cours',
      desc:  obj['Descriptif']||'',
    };
  }).filter(m=>m.title);
}

async function loadSheet(sheet){
  try{
    const r=await fetch(sheet.csvUrl);
    if(!r.ok) throw new Error(r.status);
    return csvParse(await r.text());
  }catch(e){ console.warn('Erreur',sheet.id,e); return []; }
}

// â”€â”€ TODAY â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const TODAY = new Date(); TODAY.setHours(0,0,0,0);

// â”€â”€ LIST VIEW â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderList(modules){
  const hasDates = modules.some(m=>m.start);
  return `<div class="modules-list">
    ${modules.map(m=>{
      const {label,css}=tdef(m.type);
      const dur=durLabel(m.start,m.end);
      return `<div class="module-card ${css}">
        <div>
          <div class="module-header">
            <span class="module-title">${m.title}</span>
            <span class="type-tag ${css}">${label}</span>
          </div>
          ${m.desc?`<div class="module-desc">${m.desc}</div>`:''}
        </div>
        ${hasDates?`<div class="module-dates">
          <div class="date-main">${fmtDate(m.start)}<span class="sep">â†’</span>${fmtDate(m.end)}</div>
          ${dur?`<div class="date-dur">${dur}</div>`:''}
        </div>`:''}
      </div>`;
    }).join('')}
  </div>`;
}

// â”€â”€ TIMELINE VIEW â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderTimeline(modules){
  const dm=modules.filter(m=>parseDate(m.start)&&parseDate(m.end));
  if(!dm.length) return `<div class="empty"><p>Aucune date disponible pour la vue timeline.<br>Renseignez les dates dans Google Sheets.</p></div>`;

  const allDates=dm.flatMap(m=>[parseDate(m.start),parseDate(m.end)]);
  const minD=new Date(Math.min(...allDates));
  const maxD=new Date(Math.max(...allDates));
  const rangeStart=new Date(minD.getFullYear(),minD.getMonth(),1);
  const rangeEnd  =new Date(maxD.getFullYear(),maxD.getMonth()+1,0);
  const totalMs   =rangeEnd-rangeStart;

  function pct(d){ return Math.max(0,Math.min(100,(d-rangeStart)/totalMs*100)); }

  // build months list
  const months=[]; let c=new Date(rangeStart);
  while(c<=rangeEnd){ months.push(new Date(c)); c=new Date(c.getFullYear(),c.getMonth()+1,1); }

  const LABEL_W=200;
  const isTodayInRange = TODAY>=rangeStart && TODAY<=rangeEnd;
  const todayPct = isTodayInRange ? pct(TODAY) : null;

  const monthHeader = months.map(m=>{
    const isCur = m.getFullYear()===TODAY.getFullYear() && m.getMonth()===TODAY.getMonth();
    return `<div class="tl-month-cell${isCur?' is-current':''}">${m.toLocaleDateString('fr-FR',{month:'short',year:'2-digit'})}</div>`;
  }).join('');

  const gridlines = months.map(()=>`<div class="tl-gridline"></div>`).join('');
  const todayLine = todayPct!==null ? `<div class="tl-today-line" style="left:${todayPct.toFixed(3)}%"></div>` : '';
  const todayHeaderLine = todayPct!==null ? `<div class="tl-today-header" style="left:${todayPct.toFixed(3)}%"></div>` : '';

  const rows=modules.map(m=>{
    const {label,css}=tdef(m.type);
    const s=parseDate(m.start), e=parseDate(m.end);
    const barArea = `<div class="tl-bar-area">
      <div class="tl-gridlines">${gridlines}</div>
      ${todayLine}
      ${(s&&e)?`<div class="tl-bar ${css}"
        data-title="${m.title.replace(/"/g,'&quot;')}"
        data-dates="${fmtDate(m.start)} â†’ ${fmtDate(m.end)}"
        data-desc="${(m.desc||'').replace(/"/g,'&quot;')}"
        style="left:${pct(s).toFixed(3)}%;width:${Math.max(pct(e)-pct(s),0.5).toFixed(3)}%">
        ${(pct(e)-pct(s))>6?m.title:''}
      </div>`:''}
    </div>`;
    return `<div class="tl-row" style="grid-template-columns:${LABEL_W}px 1fr;">
      <div class="tl-name ${css}"><div class="tl-type-dot"></div>${m.title}</div>
      ${barArea}
    </div>`;
  }).join('');

  return `<div class="timeline-container">
    <div class="tl-header-row" style="grid-template-columns:${LABEL_W}px 1fr;">
      <div class="tl-label-col">Module</div>
      <div class="tl-months-wrap">
        <div class="tl-months">${monthHeader}</div>
        ${todayHeaderLine}
      </div>
    </div>
    ${rows}
  </div>`;
}

// â”€â”€ PANEL â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderPanel(sheet,modules,idx){
  const countByType={};
  modules.forEach(m=>{const k=normType(m.type); countByType[k]=(countByType[k]||0)+1;});
  const usedTypes=[...new Set(modules.map(m=>normType(m.type)))].filter(t=>TYPE_DEF[t]);

  const stats=usedTypes.map(t=>{
    const d=TYPE_DEF[t];
    return `<span class="stat-item"><span class="stat-dot ${d.css}" style="background:var(--tc)"></span>${countByType[t]} ${d.label}${countByType[t]>1?'s':''}</span>`;
  }).join('');

  const projCount=modules.filter(m=>normType(m.type)==='projet').length;
  const projBadge=projCount>0?`<span class="badge badge-red">${projCount} projet${projCount>1?'s':''}</span>`:'';

  return `<div class="formation-panel${idx===0?' active':''}" id="panel-${sheet.id}">
    <div class="formation-header">
      <div>
        <div class="formation-name">${sheet.group} â€” ${sheet.label}</div>
        <div class="formation-sub">Normandie Web School</div>
        <div class="formation-badges">
          <span class="badge badge-navy">${sheet.niveau}</span>
          <span class="badge badge-teal">${modules.length} modules</span>
          ${projBadge}
        </div>
      </div>
      <div class="formation-controls">
        <div class="view-toggle">
          <button class="view-btn active" data-view="list" data-panel="${sheet.id}">
            <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="2.5" rx="1"/><rect x="1" y="6.75" width="14" height="2.5" rx="1"/><rect x="1" y="11.5" width="14" height="2.5" rx="1"/></svg>
            Liste
          </button>
          <button class="view-btn" data-view="timeline" data-panel="${sheet.id}">
            <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="3" width="5" height="3" rx="1"/><rect x="8" y="3" width="7" height="3" rx="1"/><rect x="3" y="10" width="9" height="3" rx="1"/></svg>
            Timeline
          </button>
        </div>
        <div class="stats-bar">${stats}</div>
      </div>
    </div>
    <div id="list-${sheet.id}">${renderList(modules)}</div>
    <div id="timeline-${sheet.id}" class="timeline-view">${renderTimeline(modules)}</div>
  </div>`;
}

// Build Tab
function buildTabs(){
  const groups={};
  SHEETS_CONFIG.forEach(s=>{ if(!groups[s.group]) groups[s.group]=[]; groups[s.group].push(s); });
  let firstDone=false;
  return Object.entries(groups).map(([grp,items],gi)=>{
    const btns=items.map(s=>{
      const isFirst=!firstDone; if(isFirst) firstDone=true;
      return `<button class="tab-btn${isFirst?' active':''}" data-id="${s.id}">${s.label}</button>`;
    }).join('');
    const sep=gi>0?'<div class="tab-vsep"></div>':'';
    return `${sep}<div class="tab-group">
      <span class="tab-group-label">${grp==='A1'?'A1':grp}</span>${btns}
    </div>`;
  }).join('');
}

// Tooltip
const tooltip=document.getElementById('tl-tooltip');
document.addEventListener('mousemove',e=>{
  const bar=e.target.closest('.tl-bar');
  if(!bar){ tooltip.style.display='none'; return; }
  tooltip.querySelector('.tt-title').textContent=bar.dataset.title||'';
  tooltip.querySelector('.tt-dates').textContent=bar.dataset.dates||'';
  tooltip.querySelector('.tt-desc').textContent =bar.dataset.desc||'';
  tooltip.style.display='block';
  const x=e.clientX+14, y=e.clientY+14;
  const r=tooltip.getBoundingClientRect();
  tooltip.style.left=(x+r.width>window.innerWidth ? x-r.width-28 : x)+'px';
  tooltip.style.top =(y+r.height>window.innerHeight ? y-r.height-28 : y)+'px';
});

// Init
async function init(){
  document.getElementById('today-badge').textContent =
    TODAY.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});

  const nav=document.getElementById('tabs-nav');
  const main=document.getElementById('main-content');

  nav.innerHTML=buildTabs();
  const allData=await Promise.all(SHEETS_CONFIG.map(loadSheet));
  main.innerHTML=SHEETS_CONFIG.map((s,i)=>renderPanel(s,allData[i],i)).join('');

  nav.addEventListener('click',e=>{
    const btn=e.target.closest('.tab-btn');
    if(!btn) return;
    nav.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    main.querySelectorAll('.formation-panel').forEach(p=>p.classList.remove('active'));
    main.querySelector(`#panel-${btn.dataset.id}`)?.classList.add('active');
  });

  main.addEventListener('click',e=>{
    const btn=e.target.closest('.view-btn');
    if(!btn) return;
    const {view,panel}=btn.dataset;
    btn.closest('.view-toggle').querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`list-${panel}`).style.display    =view==='list'?'':'none';
    document.getElementById(`timeline-${panel}`).style.display=view==='timeline'?'block':'none';
  });
}

init();
</script>
