<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programmes de formation - Normandie Web School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fugaz+One&family=Fira+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red:    #e94a34;
      --teal:   #00a5a5;
      --navy:   #1c1b3b;
      --dark:   #2d2d2d;
      --gray:   #5e5e5e;
      --light:  #f5f5f5;
      --white:  #ffffff;
      --border: #e0e0e0;
      --type-cours:   #00a5a5;
      --type-projet:  #e94a34;
      --type-atelier: #f59e0b;
      --type-eval:    #1c1b3b;
      --type-stage:   #3db166;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Fira Sans', sans-serif; background: var(--light); color: var(--dark); min-height: 100vh; }

    header {
      background: var(--white); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2.5rem; height: 56px;
      position: sticky; top: 0; z-index: 200;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .logo { display: flex; align-items: center; text-decoration: none; }
    .logo svg { height: 28px; width: auto; }
    .header-right { display: flex; align-items: center; gap: 0.75rem; }
    .header-divider { width: 1px; height: 20px; background: var(--border); }
    .header-label { font-size: 0.78rem; font-weight: 500; color: var(--gray); }
    .header-label strong { color: var(--navy); font-weight: 600; }
    .today-chip {
      font-size: 0.68rem; font-weight: 600;
      padding: 0.2rem 0.65rem; border-radius: 999px;
      background: rgba(233,74,52,0.08); color: var(--red);
      border: 1px solid rgba(233,74,52,0.18); white-space: nowrap;
    }

    .tabs-wrapper {
      background: var(--navy); border-bottom: 2px solid rgba(255,255,255,0.07);
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      position: sticky; top: 56px; z-index: 100;
    }
    .tabs-wrapper::-webkit-scrollbar { height: 2px; }
    .tabs-wrapper::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }
    .tabs { display: flex; padding: 0 2.5rem; min-width: max-content; }
    .tab-btn {
      background: none; border: none; border-bottom: 3px solid transparent;
      color: rgba(255,255,255,0.4); padding: 0.9rem 1.1rem;
      font-family: 'Fira Sans', sans-serif; font-size: 0.8rem; font-weight: 500;
      letter-spacing: 0.03em; cursor: pointer; white-space: nowrap;
      transition: all 0.15s; margin-bottom: -2px;
    }
    .tab-btn:hover { color: rgba(255,255,255,0.75); }
    .tab-btn.active { color: white; border-bottom-color: var(--red); }

    main { max-width: 1060px; margin: 0 auto; padding: 2.5rem 2rem 5rem; }
    .formation-panel { display: none; }
    .formation-panel.active { display: block; animation: fadeIn 0.22s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

    .formation-meta {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem;
      padding: 1.25rem 1.5rem; background: white;
      border: 1px solid var(--border); border-radius: 10px; border-left: 4px solid var(--red);
    }
    .formation-name { font-family: 'Fugaz One', display; font-size: 1.55rem; color: var(--navy); }
    .formation-badges { display: flex; gap: 0.5rem; margin-top: 0.4rem; flex-wrap: wrap; }
    .badge { font-size: 0.67rem; font-weight: 600; padding: 0.22rem 0.65rem; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.07em; }
    .badge-navy { background: var(--navy); color: white; }
    .badge-teal { background: rgba(0,165,165,0.12); color: var(--teal); }

    .view-toggle { display: flex; background: white; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
    .view-btn {
      background: none; border: none; padding: 0.5rem 1rem;
      font-family: 'Fira Sans', sans-serif; font-size: 0.78rem; font-weight: 500;
      color: var(--gray); cursor: pointer; display: flex; align-items: center; gap: 0.4rem; transition: all 0.15s;
    }
    .view-btn.active { background: var(--navy); color: white; }
    .view-btn:not(.active):hover { background: var(--light); }
    .view-btn svg { width: 14px; height: 14px; }

    .legend { display: flex; gap: 1.25rem; flex-wrap: wrap; margin-bottom: 1.25rem; padding: 0.7rem 1rem; background: white; border: 1px solid var(--border); border-radius: 8px; }
    .legend-item { display: flex; align-items: center; gap: 0.45rem; font-size: 0.75rem; color: var(--gray); font-weight: 500; }
    .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

    .modules-list { display: grid; gap: 0.6rem; }
    .module-card {
      background: white; border: 1px solid var(--border);
      border-left: 4px solid var(--tc, var(--gray));
      border-radius: 0 8px 8px 0; padding: 1rem 1.2rem;
      display: grid; grid-template-columns: 1fr auto; gap: 0.75rem 1.5rem; align-items: start;
      transition: box-shadow 0.15s, transform 0.15s;
    }
    .module-card:hover { box-shadow: 0 3px 16px rgba(0,0,0,0.07); transform: translateX(2px); }
    .module-header { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .module-title { font-weight: 600; font-size: 0.95rem; color: var(--dark); }
    .type-tag { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; padding: 0.15rem 0.55rem; border-radius: 4px; color: var(--tc); background: color-mix(in srgb, var(--tc) 12%, transparent); flex-shrink: 0; }
    .module-desc { font-size: 0.83rem; color: var(--gray); font-weight: 300; line-height: 1.55; margin-top: 0.35rem; }
    .module-dates { text-align: right; flex-shrink: 0; white-space: nowrap; }
    .date-main { font-size: 0.78rem; font-weight: 500; color: var(--dark); }
    .date-main .sep { color: var(--red); margin: 0 0.25rem; }
    .date-dur { font-size: 0.7rem; color: var(--gray); margin-top: 0.15rem; font-weight: 300; }

    .timeline-view { display: none; }
    .timeline-container { background: white; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .tl-header-row { display: grid; border-bottom: 2px solid var(--border); background: var(--light); position: sticky; top: 102px; z-index: 10; }
    .tl-label-col { padding: 0.65rem 1rem; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--gray); border-right: 1px solid var(--border); }
    .tl-months-wrap { position: relative; overflow: hidden; }
    .tl-months { display: flex; }
    .tl-month-cell { flex: 1; text-align: center; padding: 0.65rem 0.25rem; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gray); border-right: 1px solid var(--border); white-space: nowrap; overflow: hidden; }
    .tl-month-cell:last-child { border-right: none; }
    .tl-month-cell.is-current { color: var(--red); font-weight: 700; }
    .tl-today-head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--red); opacity: 0.35; pointer-events: none; z-index: 3; }
    .tl-row { display: grid; border-bottom: 1px solid var(--border); min-height: 30px; }
    .tl-row:last-child { border-bottom: none; }
    .tl-row:hover { background: #fafafa; }
    .tl-name { padding: 0.25rem 1rem; font-size: 0.72rem; font-weight: 500; color: var(--dark); border-right: 1px solid var(--border); display: flex; align-items: center; gap: 0.45rem; line-height: 1.25; word-break: break-word; }
    .tl-type-dot { width: 7px; height: 7px; border-radius: 2px; background: var(--tc); flex-shrink: 0; }
    .tl-bar-area { position: relative; padding: 5px 4px; overflow: hidden; }
    .tl-gridlines { position: absolute; inset: 0; display: flex; pointer-events: none; }
    .tl-gridline { flex: 1; border-right: 1px solid rgba(0,0,0,0.045); }
    .tl-today-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--red); opacity: 0.65; z-index: 4; pointer-events: none; }
    .tl-bar {
      position: absolute; top: 50%; transform: translateY(-50%);
      height: 16px; border-radius: 3px; background: var(--tc);
      display: flex; align-items: center; padding: 0 6px;
      font-size: 0.59rem; font-weight: 600; color: white;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      opacity: 0.85; transition: opacity 0.15s; cursor: default; z-index: 1;
    }
    .tl-bar:hover { opacity: 1; z-index: 5; }

    #tl-tooltip {
      position: fixed; background: var(--navy); color: white;
      padding: 0.6rem 0.9rem; border-radius: 8px; font-size: 0.75rem; line-height: 1.5;
      max-width: 290px; pointer-events: none; z-index: 9999; display: none;
      box-shadow: 0 4px 18px rgba(0,0,0,0.28);
    }
    #tl-tooltip .tt-title { font-weight: 600; font-size: 0.79rem; margin-bottom: 0.15rem; }
    #tl-tooltip .tt-dates { font-size: 0.67rem; opacity: 0.6; margin-bottom: 0.25rem; }
    #tl-tooltip .tt-desc  { font-size: 0.71rem; opacity: 0.85; font-weight: 300; }

    .tc-cours        { --tc: var(--type-cours);   }
    .tc-projet       { --tc: var(--type-projet);  }
    .tc-atelier      { --tc: var(--type-atelier); }
    .tc-eval         { --tc: var(--type-eval);    }
    .tc-evaluation   { --tc: var(--type-eval);    }
    .tc-valuation    { --tc: var(--type-eval);    }
    .tc-partiel      { --tc: var(--type-eval);    }
    .tc-stage        { --tc: var(--type-stage);   }
    .tc-admin        { --tc: #9ca3af;             }
    .tc-accompagement{ --tc: #9ca3af;             }

    .empty { text-align: center; padding: 4rem; color: var(--gray); font-size: 0.88rem; line-height: 1.7; }
    .error-note { color: var(--red); font-size: 0.78rem; margin-top: 0.5rem; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer { background: var(--navy); color: rgba(255,255,255,0.3); text-align: center; padding: 1.25rem; font-size: 0.72rem; letter-spacing: 0.04em; }

    @media (max-width: 640px) {
      header { padding: 0 1rem; }
      .tabs { padding: 0 1rem; }
      main { padding: 1.5rem 1rem 3rem; }
      .module-card { grid-template-columns: 1fr; }
      .module-dates { text-align: left; }
      .today-chip, .header-divider, .header-label { display: none; }
      .tl-name, .tl-label-col { width: 110px !important; font-size: 0.7rem; }
    }
  </style>
</head>

<script>

var BASE = 'https://docs.google.com/spreadsheets/d/1SMWsb0or1m-Jza0N2TuUZ4HkQdFDuoMvF-RvbBpaxpU/gviz/tq?tqx=out:csv&sheet=';

var SHEETS = [
  { id:'a1',     label:'Ann\u00e9e 1',          niveau:'Tronc commun', url:BASE+'A1'          },
  { id:'a2-dw',  label:'A2 - Dev Web',           niveau:'BAC+2',        url:BASE+'A2%20DW'     },
  { id:'a2-cg',  label:'A2 - Comm. Graph',       niveau:'BAC+2',        url:BASE+'A2%20CG'     },
  { id:'a2-cmd', label:'A2 - C&amp;MD',          niveau:'BAC+2',        url:BASE+'A2%20C%26MD' },
  { id:'a3-dw',  label:'A3 - Dev Web',           niveau:'BAC+3',        url:BASE+'A3%20DW'     },
  { id:'a3-cg',  label:'A3 - Comm. Graph',       niveau:'BAC+3',        url:BASE+'A3%20CG'     },
  { id:'a3-cmd', label:'A3 - C&amp;MD',          niveau:'BAC+3',        url:BASE+'A3%20C%26MD' },
  { id:'a4-dw',  label:'A4 - Dev Web',           niveau:'BAC+4',        url:BASE+'A4%20DW'     },
  { id:'a4-cg',  label:'A4 - Comm. Graph',       niveau:'BAC+4',        url:BASE+'A4%20CG'     },
  { id:'a4-cmd', label:'A4 - C&amp;MD',          niveau:'BAC+4',        url:BASE+'A4%20C%26MD' },
  { id:'a5-dw',  label:'A5 - Dev Web',           niveau:'BAC+5',        url:BASE+'A5%20DW'     },
  { id:'a5-cg',  label:'A5 - Comm. Graph',       niveau:'BAC+5',        url:BASE+'A5%20CG'     },
  { id:'a5-cmd', label:'A5 - C&amp;MD',          niveau:'BAC+5',        url:BASE+'A5%20C%26MD' },
];

var TYPE_DEF = {
  'cours':        { label:'Cours',   cls:'tc-cours'         },
  'projet':       { label:'Projet',  cls:'tc-projet'        },
  'atelier':      { label:'Atelier', cls:'tc-atelier'       },
  'eval':         { label:'Eval.',   cls:'tc-eval'          },
  'evaluation':   { label:'Eval.',   cls:'tc-eval'          },
  'partiel':      { label:'Partiel', cls:'tc-partiel'       },
  'stage':        { label:'Stage',   cls:'tc-stage'         },
  'admin':        { label:'Admin',   cls:'tc-admin'         },
  'accompagement':{ label:'Suivi',   cls:'tc-accompagement' },
};

function normType(t) {
  return (t || 'cours').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function tdef(t) { return TYPE_DEF[normType(t)] || { label:t, cls:'tc-cours' }; }

function parseDate(s) {
  if (!s) return null;
  var parts = s.trim().replace(/\s.*$/, '').split('/');
  if (parts.length !== 3) return null;
  var d = new Date(parts[2] + '-' + parts[1].padStart(2,'0') + '-' + parts[0].padStart(2,'0'));
  return isNaN(d.getTime()) ? null : d;
}

function fmtDate(s) {
  var d = parseDate(s);
  return d ? d.toLocaleDateString('fr-FR', { day:'numeric', month:'short' }) : '';
}

function durLabel(s, e) {
  var sd = parseDate(s), ed = parseDate(e);
  if (!sd || !ed) return null;
  var days = Math.round((ed - sd) / 86400000);
  if (days <= 0) return '1 j';
  var w = Math.round(days / 7);
  return w <= 1 ? (days + 1) + ' j' : w + ' sem.';
}

function parseCsvLine(line) {
  var vals = [], cur = '', inQ = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (ch === '"') {
      if (inQ && line[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (ch === ',' && !inQ) {
      vals.push(cur); cur = '';
    } else {
      cur += ch;
    }
  }
  vals.push(cur);
  return vals;
}

function csvParse(text) {
  // Strip BOM and normalise line endings
  text = text.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
  var lines = text.split('\n');
  if (lines.length < 2) return [];

  var rawHeaders = parseCsvLine(lines[0]);
  // Normalise headers: strip quotes, trim, remove accents for comparison
  var headers = rawHeaders.map(function(h) { return h.trim(); });

  function colIdx(names) {
    for (var n = 0; n < names.length; n++) {
      var target = names[n].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      for (var i = 0; i < headers.length; i++) {
        var h = headers[i].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        if (h === target) return i;
      }
    }
    return -1;
  }

  // Find column indices once
  var iTitle = colIdx(['intitul\u00e9', 'intitule', 'title']);
  var iStart = colIdx(['date d\u00e9but', 'date debut', 'start']);
  var iEnd   = colIdx(['date fin', 'end']);
  var iType  = colIdx(['type']);
  var iDesc  = colIdx(['descriptif', 'description', 'desc']);

  if (iTitle === -1) {
    console.warn('Colonne Intitule introuvable. Headers:', headers);
    return [];
  }

  var results = [];
  for (var r = 1; r < lines.length; r++) {
    if (!lines[r].trim()) continue;
    var vals = parseCsvLine(lines[r]);
    var title = (vals[iTitle] || '').trim();
    if (!title) continue;
    results.push({
      title: title,
      start: iStart >= 0 ? (vals[iStart] || '').trim() : '',
      end:   iEnd   >= 0 ? (vals[iEnd]   || '').trim() : '',
      type:  iType  >= 0 ? (vals[iType]  || '').trim() : 'cours',
      desc:  iDesc  >= 0 ? (vals[iDesc]  || '').trim() : '',
    });
  }
  return results;
}

function loadSheet(sheet) {
  return fetch(sheet.url)
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(csvParse)
    .catch(function(e) {
      console.warn('Erreur chargement', sheet.id, e.message);
      return null;
    });
}

var TODAY = new Date(); TODAY.setHours(0,0,0,0);

function renderList(modules) {
  var html = '<div class="modules-list">';
  for (var i = 0; i < modules.length; i++) {
    var m = modules[i];
    var d = tdef(m.type);
    var dur = durLabel(m.start, m.end);
    html += '<div class="module-card ' + d.cls + '">';
    html +=   '<div>';
    html +=     '<div class="module-header">';
    html +=       '<span class="module-title">' + m.title + '</span>';
    html +=       '<span class="type-tag ' + d.cls + '">' + d.label + '</span>';
    html +=     '</div>';
    if (m.desc) html += '<div class="module-desc">' + m.desc + '</div>';
    html +=   '</div>';
    html +=   '<div class="module-dates">';
    html +=     '<div class="date-main">' + fmtDate(m.start) + '<span class="sep">&rarr;</span>' + fmtDate(m.end) + '</div>';
    if (dur) html += '<div class="date-dur">' + dur + '</div>';
    html +=   '</div>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderTimeline(modules) {
  var dm = modules.filter(function(m) { return parseDate(m.start) && parseDate(m.end); });
  if (!dm.length) return '<div class="empty"><p>Aucune date disponible.<br>Renseignez les dates dans Google Sheets.</p></div>';

  var allDates = [];
  for (var i = 0; i < dm.length; i++) { allDates.push(parseDate(dm[i].start), parseDate(dm[i].end)); }
  var minD = new Date(Math.min.apply(null, allDates));
  var maxD = new Date(Math.max.apply(null, allDates));
  var rangeStart = new Date(minD.getFullYear(), minD.getMonth(), 1);
  var rangeEnd   = new Date(maxD.getFullYear(), maxD.getMonth() + 1, 0);
  var totalMs    = rangeEnd - rangeStart;

  function pct(d) { return Math.max(0, Math.min(100, (d - rangeStart) / totalMs * 100)); }

  var months = [];
  var c = new Date(rangeStart);
  while (c <= rangeEnd) { months.push(new Date(c)); c = new Date(c.getFullYear(), c.getMonth() + 1, 1); }

  var todayIn  = TODAY >= rangeStart && TODAY <= rangeEnd;
  var todayPct = todayIn ? pct(TODAY).toFixed(3) : null;
  var LABEL_W  = 190;

  var monthCols = '';
  for (var m = 0; m < months.length; m++) {
    var mo = months[m];
    var isCur = mo.getFullYear() === TODAY.getFullYear() && mo.getMonth() === TODAY.getMonth();
    monthCols += '<div class="tl-month-cell' + (isCur ? ' is-current' : '') + '">';
    monthCols += mo.toLocaleDateString('fr-FR', { month:'short', year:'2-digit' });
    monthCols += '</div>';
  }
  var gridlines = '';
  for (var g = 0; g < months.length; g++) gridlines += '<div class="tl-gridline"></div>';

  var todayLine = todayPct ? '<div class="tl-today-line" style="left:' + todayPct + '%"></div>' : '';
  var todayHead = todayPct ? '<div class="tl-today-head" style="left:' + todayPct + '%"></div>' : '';

  var rows = '';
  for (var i = 0; i < modules.length; i++) {
    var m = modules[i];
    var d  = tdef(m.type);
    var s  = parseDate(m.start), e = parseDate(m.end);
    var bar = '';
    if (s && e) {
      var left = pct(s), w = Math.max(pct(e) - left, 0.5);
      var safeTitle = m.title.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      var safeDesc  = m.desc.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      bar = '<div class="tl-bar ' + d.cls + '"'
          + ' data-title="' + safeTitle + '"'
          + ' data-dates="' + fmtDate(m.start) + ' &rarr; ' + fmtDate(m.end) + '"'
          + ' data-desc="'  + safeDesc  + '"'
          + ' style="left:' + left.toFixed(3) + '%;width:' + w.toFixed(3) + '%">'
          + (w > 6 ? m.title : '')
          + '</div>';
    }
    rows += '<div class="tl-row" style="grid-template-columns:' + LABEL_W + 'px 1fr;">';
    rows +=   '<div class="tl-name ' + d.cls + '"><div class="tl-type-dot"></div>' + m.title + '</div>';
    rows +=   '<div class="tl-bar-area"><div class="tl-gridlines">' + gridlines + '</div>' + todayLine + bar + '</div>';
    rows += '</div>';
  }

  return '<div class="timeline-container">'
    + '<div class="tl-header-row" style="grid-template-columns:' + LABEL_W + 'px 1fr;">'
    +   '<div class="tl-label-col">Module</div>'
    +   '<div class="tl-months-wrap"><div class="tl-months">' + monthCols + '</div>' + todayHead + '</div>'
    + '</div>'
    + rows
    + '</div>';
}

function renderPanel(sheet, modules, idx) {
  if (modules === null) {
    return '<div class="formation-panel' + (idx===0?' active':'') + '" id="panel-' + sheet.id + '">'
      + '<div class="empty"><p>Impossible de charger les donn\u00e9es.</p>'
      + '<p class="error-note">V\u00e9rifiez que le Google Sheet est publi\u00e9 (Fichier &rarr; Partager &rarr; Publier sur le web &rarr; CSV).</p></div>'
      + '</div>';
  }

  var usedTypes = [];
  for (var i = 0; i < modules.length; i++) {
    var k = normType(modules[i].type);
    if (usedTypes.indexOf(k) === -1) usedTypes.push(k);
  }
  var legend = '';
  for (var i = 0; i < usedTypes.length; i++) {
    var t = usedTypes[i];
    if (!TYPE_DEF[t]) continue;
    var d = TYPE_DEF[t];
    legend += '<div class="legend-item"><div class="legend-dot ' + d.cls + '" style="background:var(--tc)"></div>' + d.label + '</div>';
  }

  return '<div class="formation-panel' + (idx===0?' active':'') + '" id="panel-' + sheet.id + '">'
    + '<div class="formation-meta">'
    +   '<div>'
    +     '<div class="formation-name">' + sheet.label + '</div>'
    +     '<div class="formation-badges">'
    +       '<span class="badge badge-navy">' + sheet.niveau + '</span>'
    +       '<span class="badge badge-teal">' + modules.length + ' module' + (modules.length>1?'s':'') + '</span>'
    +     '</div>'
    +   '</div>'
    +   '<div class="view-toggle">'
    +     '<button class="view-btn active" data-view="list" data-panel="' + sheet.id + '">'
    +       '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="2.5" rx="1"/><rect x="1" y="6.75" width="14" height="2.5" rx="1"/><rect x="1" y="11.5" width="14" height="2.5" rx="1"/></svg>Liste'
    +     '</button>'
    +     '<button class="view-btn" data-view="timeline" data-panel="' + sheet.id + '">'
    +       '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="3" width="5" height="3" rx="1"/><rect x="8" y="3" width="7" height="3" rx="1"/><rect x="3" y="10" width="9" height="3" rx="1"/></svg>Timeline'
    +     '</button>'
    +   '</div>'
    + '</div>'
    + '<div class="legend">' + legend + '</div>'
    + '<div id="list-' + sheet.id + '">' + renderList(modules) + '</div>'
    + '<div id="timeline-' + sheet.id + '" class="timeline-view">' + renderTimeline(modules) + '</div>'
    + '</div>';
}

// Tooltip
var tooltip = document.getElementById('tl-tooltip');
document.addEventListener('mousemove', function(e) {
  var bar = e.target.closest ? e.target.closest('.tl-bar') : null;
  if (!bar) { tooltip.style.display = 'none'; return; }
  tooltip.querySelector('.tt-title').textContent = bar.dataset.title || '';
  tooltip.querySelector('.tt-dates').innerHTML   = bar.dataset.dates || '';
  tooltip.querySelector('.tt-desc').textContent  = bar.dataset.desc  || '';
  tooltip.style.display = 'block';
  var x = e.clientX + 14, y = e.clientY + 14;
  var r = tooltip.getBoundingClientRect();
  tooltip.style.left = (x + r.width  > window.innerWidth  ? x - r.width  - 28 : x) + 'px';
  tooltip.style.top  = (y + r.height > window.innerHeight ? y - r.height - 28 : y) + 'px';
});

async function init() {
  document.getElementById('today-chip').textContent =
    TODAY.toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });

  var nav  = document.getElementById('tabs-nav');
  var main = document.getElementById('main-content');

  nav.innerHTML = SHEETS.map(function(s, i) {
    return '<button class="tab-btn' + (i===0?' active':'') + '" data-id="' + s.id + '">' + s.label + '</button>';
  }).join('');

  var allData = await Promise.all(SHEETS.map(loadSheet));

  main.innerHTML = SHEETS.map(function(s, i) {
    return renderPanel(s, allData[i], i);
  }).join('');

  nav.addEventListener('click', function(e) {
    var btn = e.target.closest('.tab-btn');
    if (!btn) return;
    nav.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    main.querySelectorAll('.formation-panel').forEach(function(p) { p.classList.remove('active'); });
    var panel = main.querySelector('#panel-' + btn.dataset.id);
    if (panel) panel.classList.add('active');
  });

  main.addEventListener('click', function(e) {
    var btn = e.target.closest('.view-btn');
    if (!btn) return;
    var view = btn.dataset.view, panel = btn.dataset.panel;
    btn.closest('.view-toggle').querySelectorAll('.view-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('list-' + panel).style.display     = view === 'list'     ? '' : 'none';
    document.getElementById('timeline-' + panel).style.display = view === 'timeline' ? 'block' : 'none';
  });
}

init();

</script>
