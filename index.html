<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programmes de formation — Normandie Web School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fugaz+One&family=Fira+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red:    #e94a34;
      --teal:   #00a5a5;
      --navy:   #1c1b3b;
      --dark:   #2d2d2d;
      --gray:   #5e5e5e;
      --light:  #f5f5f5;
      --white:  #ffffff;
      --border: #e0e0e0;

      --type-cours:   #00a5a5;
      --type-projet:  #e94a34;
      --type-atelier: #f59e0b;
      --type-eval:    #1c1b3b;
      --type-stage:   #3db166;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Fira Sans', sans-serif;
      background: var(--light);
      color: var(--dark);
      min-height: 100vh;
    }

    /* ── HEADER ─────────────────────────────────────── */
    header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2.5rem;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 200;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .logo svg {
      height: 28px;
      width: auto;
    }

    .header-divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 1rem;
      flex-shrink: 0;
    }

    .header-label {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--gray);
      letter-spacing: 0.01em;
    }

    .header-label strong {
      color: var(--navy);
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .header-divider, .header-label { display: none; }
    }

    /* ── HERO ────────────────────────────────────────── */
    .hero {
      background: var(--navy);
      padding: 3rem 2.5rem 0;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      right: -60px; top: -60px;
      width: 320px; height: 320px;
      background: var(--teal);
      opacity: 0.08;
      border-radius: 50%;
    }

    .hero::after {
      content: '';
      position: absolute;
      right: 80px; bottom: -40px;
      width: 180px; height: 180px;
      background: var(--red);
      opacity: 0.1;
      border-radius: 50%;
    }

    .hero-content { position: relative; z-index: 1; }

    .hero h1 {
      font-family: 'Fugaz One', display;
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      color: white;
      letter-spacing: 0.01em;
      line-height: 1.05;
    }

    .hero h1 .accent  { color: var(--red);  }
    .hero h1 .accent2 { color: var(--teal); }

    .hero-lead {
      margin-top: 0.6rem;
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
      font-weight: 300;
      max-width: 500px;
    }

    /* ── TABS ────────────────────────────────────────── */
    .tabs-wrapper {
      background: var(--navy);
      border-bottom: 2px solid rgba(255,255,255,0.07);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: 2rem;
    }

    .tabs-wrapper::-webkit-scrollbar { height: 2px; }
    .tabs-wrapper::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }

    .tabs {
      display: flex;
      padding: 0 2.5rem;
      min-width: max-content;
    }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: rgba(255,255,255,0.4);
      padding: 0.9rem 1.1rem;
      font-family: 'Fira Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      margin-bottom: -2px;
    }

    .tab-btn:hover { color: rgba(255,255,255,0.75); }
    .tab-btn.active { color: white; border-bottom-color: var(--red); }

    /* ── LAYOUT ──────────────────────────────────────── */
    main {
      max-width: 1060px;
      margin: 0 auto;
      padding: 2.5rem 2rem 5rem;
    }

    .formation-panel { display: none; }
    .formation-panel.active { display: block; animation: fadeIn 0.22s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── FORMATION META ──────────────────────────────── */
    .formation-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .formation-name {
      font-family: 'Fugaz One', display;
      font-size: 1.6rem;
      color: var(--navy);
      letter-spacing: 0.01em;
    }

    .formation-badges {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.4rem;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .badge-navy { background: var(--navy); color: white; }
    .badge-teal { background: rgba(0,165,165,0.12); color: var(--teal); }

    /* ── VIEW TOGGLE ─────────────────────────────────── */
    .view-toggle {
      display: flex;
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .view-btn {
      background: none;
      border: none;
      padding: 0.5rem 1rem;
      font-family: 'Fira Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--gray);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s;
    }

    .view-btn.active { background: var(--navy); color: white; }
    .view-btn:not(.active):hover { background: var(--light); }
    .view-btn svg { width: 14px; height: 14px; }

    /* ── LEGEND ──────────────────────────────────────── */
    .legend {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
      padding: 0.7rem 1rem;
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.75rem;
      color: var(--gray);
      font-weight: 500;
    }

    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* ── MODULE LIST ─────────────────────────────────── */
    .modules-list { display: grid; gap: 0.6rem; }

    .module-card {
      background: white;
      border: 1px solid var(--border);
      border-left: 4px solid var(--tc, var(--gray));
      border-radius: 0 8px 8px 0;
      padding: 1rem 1.2rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem 1.5rem;
      align-items: start;
      transition: box-shadow 0.15s, transform 0.15s;
    }

    .module-card:hover {
      box-shadow: 0 3px 16px rgba(0,0,0,0.07);
      transform: translateX(2px);
    }

    .module-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .module-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--dark);
    }

    .type-tag {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.15rem 0.55rem;
      border-radius: 4px;
      color: var(--tc);
      background: color-mix(in srgb, var(--tc) 12%, transparent);
      flex-shrink: 0;
    }

    .module-desc {
      font-size: 0.83rem;
      color: var(--gray);
      font-weight: 300;
      line-height: 1.55;
      margin-top: 0.35rem;
    }

    .module-dates { text-align: right; flex-shrink: 0; white-space: nowrap; }

    .date-main {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--dark);
    }

    .date-main .sep { color: var(--red); margin: 0 0.25rem; }

    .date-dur {
      font-size: 0.7rem;
      color: var(--gray);
      margin-top: 0.15rem;
      font-weight: 300;
    }

    /* ── TIMELINE ────────────────────────────────────── */
    .timeline-view { display: none; }
    .timeline-view.show { display: block; }

    .timeline-container {
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .tl-header-row {
      display: grid;
      border-bottom: 2px solid var(--border);
      background: var(--light);
    }

    .tl-label-col {
      padding: 0.65rem 1rem;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--gray);
      border-right: 1px solid var(--border);
      width: 190px;
    }

    .tl-months {
      display: flex;
      overflow: hidden;
    }

    .tl-month-cell {
      flex: 1;
      text-align: center;
      padding: 0.65rem 0.25rem;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--gray);
      border-right: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
    }

    .tl-month-cell:last-child { border-right: none; }

    .tl-row {
      display: grid;
      border-bottom: 1px solid var(--border);
      min-height: 46px;
    }

    .tl-row:last-child { border-bottom: none; }
    .tl-row:hover { background: #fafafa; }

    .tl-name {
      padding: 0.55rem 1rem;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--dark);
      border-right: 1px solid var(--border);
      width: 190px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      line-height: 1.3;
      word-break: break-word;
    }

    .tl-type-dot {
      width: 8px; height: 8px;
      border-radius: 2px;
      background: var(--tc);
      flex-shrink: 0;
    }

    .tl-bar-area {
      position: relative;
      padding: 10px 4px;
      overflow: hidden;
    }

    .tl-gridlines {
      position: absolute;
      inset: 0;
      display: flex;
      pointer-events: none;
    }

    .tl-gridline {
      flex: 1;
      border-right: 1px solid rgba(0,0,0,0.045);
    }

    .tl-bar {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      height: 22px;
      border-radius: 4px;
      background: var(--tc);
      display: flex;
      align-items: center;
      padding: 0 7px;
      font-size: 0.63rem;
      font-weight: 600;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0.88;
      transition: opacity 0.15s, height 0.12s;
      cursor: default;
      z-index: 1;
    }

    .tl-bar:hover {
      opacity: 1;
      height: 28px;
      z-index: 5;
    }

    /* ── TYPE COLOR MAP ──────────────────────────────── */
    .tc-cours       { --tc: var(--type-cours);   }
    .tc-projet      { --tc: var(--type-projet);  }
    .tc-atelier     { --tc: var(--type-atelier); }
    .tc-eval        { --tc: var(--type-eval);    }
    .tc-evaluation  { --tc: var(--type-eval);    }
    .tc-valuation   { --tc: var(--type-eval);    }
    .tc-stage       { --tc: var(--type-stage);   }

    /* ── LOADING ─────────────────────────────────────── */
    .empty {
      text-align: center;
      padding: 4rem;
      color: var(--gray);
    }

    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── FOOTER ──────────────────────────────────────── */
    footer {
      background: var(--navy);
      color: rgba(255,255,255,0.3);
      text-align: center;
      padding: 1.25rem;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
    }

    /* ── RESPONSIVE ──────────────────────────────────── */
    @media (max-width: 640px) {
      header { padding: 0 1rem; }
      .hero  { padding: 2rem 1rem 0; }
      .tabs  { padding: 0 1rem; }
      main   { padding: 1.5rem 1rem 3rem; }
      .module-card { grid-template-columns: 1fr; }
      .module-dates { text-align: left; }
      .logo-name { display: none; }
      .tl-name, .tl-label-col { width: 110px; font-size: 0.7rem; }
    }
  </style>
</head>

// ─────────────────────────────────────────────────────────────
// TYPES
// ─────────────────────────────────────────────────────────────

const TYPE_DEF = {
  cours:      { label:'Cours',    cssClass:'tc-cours'    },
  projet:     { label:'Projet',   cssClass:'tc-projet'   },
  atelier:    { label:'Atelier',  cssClass:'tc-atelier'  },
  eval:       { label:'Éval.',    cssClass:'tc-eval'     },
  evaluation: { label:'Éval.',    cssClass:'tc-eval'     },
  stage:      { label:'Stage',    cssClass:'tc-stage'    },
};

function normType(t) {
  return (t || 'cours').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function tdef(type) {
  return TYPE_DEF[normType(type)] || { label: type, cssClass: 'tc-cours' };
}

// ─────────────────────────────────────────────────────────────
// DATE UTILS
// ─────────────────────────────────────────────────────────────

function parseDate(s) {
  if (!s) return null;
  const [d, m, y] = s.split('/');
  return new Date(`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`);
}

function fmtDate(s) {
  const d = parseDate(s);
  if (!d) return s;
  return d.toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
}

function durLabel(s, e) {
  const sd = parseDate(s), ed = parseDate(e);
  if (!sd || !ed) return null;
  const days = Math.round((ed - sd) / 86400000);
  const w = Math.round(days / 7);
  return w <= 1 ? `${Math.max(1, days)} j` : `${w} sem.`;
}

function csvParse(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
  return lines.slice(1).map(line => {
    const vals = line.match(/(".*?"|[^,]+)(?=,|$)/g) || [];
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (vals[i] || '').trim().replace(/^"|"$/g, ''); });
    return {
      title: obj['Intitulé'] || obj['intitule'] || obj['title'] || '',
      start: obj['Date début'] || obj['date_debut'] || obj['start'] || '',
      end:   obj['Date fin']   || obj['date_fin']   || obj['end']   || '',
      type:  (obj['Type'] || obj['type'] || 'cours').toLowerCase(),
      desc:  obj['Descriptif'] || obj['description'] || obj['desc'] || '',
    };
  });
}

async function loadSheet(sheet) {
  if (!sheet.csvUrl) return MOCK[sheet.id] || [];
  try {
    const r = await fetch(sheet.csvUrl);
    return csvParse(await r.text());
  } catch { return MOCK[sheet.id] || []; }
}

// ─────────────────────────────────────────────────────────────
// LIST VIEW
// ─────────────────────────────────────────────────────────────

function renderList(modules) {
  return `<div class="modules-list" id="list-inner">
    ${modules.map(m => {
      const { label, cssClass } = tdef(m.type);
      const dur = durLabel(m.start, m.end);
      return `<div class="module-card ${cssClass}">
        <div>
          <div class="module-header">
            <span class="module-title">${m.title}</span>
            <span class="type-tag ${cssClass}">${label}</span>
          </div>
          ${m.desc ? `<div class="module-desc">${m.desc}</div>` : ''}
        </div>
        <div class="module-dates">
          <div class="date-main">${fmtDate(m.start)}<span class="sep">→</span>${fmtDate(m.end)}</div>
          ${dur ? `<div class="date-dur">${dur}</div>` : ''}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

// ─────────────────────────────────────────────────────────────
// TIMELINE VIEW
// ─────────────────────────────────────────────────────────────

function renderTimeline(modules) {
  const dates = modules.flatMap(m => [parseDate(m.start), parseDate(m.end)]).filter(Boolean);
  if (!dates.length) return '<div class="empty"><p>Aucune date disponible.</p></div>';

  const minD = new Date(Math.min(...dates));
  const maxD = new Date(Math.max(...dates));
  const rangeStart = new Date(minD.getFullYear(), minD.getMonth(), 1);
  const rangeEnd   = new Date(maxD.getFullYear(), maxD.getMonth() + 1, 0);
  const totalMs    = rangeEnd - rangeStart;

  const months = [];
  let c = new Date(rangeStart);
  while (c <= rangeEnd) {
    months.push(new Date(c));
    c = new Date(c.getFullYear(), c.getMonth() + 1, 1);
  }

  function pct(date) {
    return ((date - rangeStart) / totalMs * 100).toFixed(3);
  }

  const LABEL_W = 190;

  const monthCols = months.map(m =>
    `<div class="tl-month-cell">${m.toLocaleDateString('fr-FR', { month:'short', year:'2-digit' })}</div>`
  ).join('');

  const gridlines = months.map(() => `<div class="tl-gridline"></div>`).join('');

  const rows = modules.map(m => {
    const { label, cssClass } = tdef(m.type);
    const s = parseDate(m.start), e = parseDate(m.end);
    if (!s || !e) return '';
    const left  = parseFloat(pct(s));
    const right = parseFloat(pct(e));
    const w = Math.max(right - left, 0.8);

    return `<div class="tl-row" style="grid-template-columns:${LABEL_W}px 1fr;">
      <div class="tl-name ${cssClass}">
        <div class="tl-type-dot"></div>${m.title}
      </div>
      <div class="tl-bar-area">
        <div class="tl-gridlines">${gridlines}</div>
        <div class="tl-bar ${cssClass}"
             title="${m.title}&#10;${m.start} → ${m.end}"
             style="left:${left}%;width:${w}%;background:var(--tc)">
          ${w > 7 ? label : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  return `<div class="timeline-container">
    <div class="tl-header-row" style="grid-template-columns:${LABEL_W}px 1fr;">
      <div class="tl-label-col">Module</div>
      <div class="tl-months">${monthCols}</div>
    </div>
    ${rows}
  </div>`;
}

// ─────────────────────────────────────────────────────────────
// PANEL
// ─────────────────────────────────────────────────────────────

function renderPanel(sheet, modules, idx) {
  const usedTypes = [...new Set(modules.map(m => normType(m.type)))];
  const legend = usedTypes.map(t => {
    const d = TYPE_DEF[t] || { label: t, cssClass: 'tc-cours' };
    return `<div class="legend-item">
      <div class="legend-dot ${d.cssClass}" style="background:var(--tc)"></div>${d.label}
    </div>`;
  }).join('');

  return `<div class="formation-panel${idx === 0 ? ' active' : ''}" id="panel-${sheet.id}">
    <div class="formation-meta">
      <div>
        <div class="formation-name">${sheet.label.replace(/^BAC\+\d\s*[—\-]\s*/, '')}</div>
        <div class="formation-badges">
          <span class="badge badge-navy">${sheet.niveau}</span>
          <span class="badge badge-teal">${modules.length} module${modules.length > 1 ? 's' : ''}</span>
        </div>
      </div>
      <div class="view-toggle">
        <button class="view-btn active" data-view="list" data-panel="${sheet.id}">
          <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="2.5" rx="1"/><rect x="1" y="6.75" width="14" height="2.5" rx="1"/><rect x="1" y="11.5" width="14" height="2.5" rx="1"/></svg>
          Liste
        </button>
        <button class="view-btn" data-view="timeline" data-panel="${sheet.id}">
          <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="3" width="5" height="3" rx="1"/><rect x="8" y="3" width="7" height="3" rx="1"/><rect x="3" y="10" width="9" height="3" rx="1"/></svg>
          Timeline
        </button>
      </div>
    </div>

    <div class="legend">${legend}</div>

    <div id="list-${sheet.id}">${renderList(modules)}</div>
    <div id="timeline-${sheet.id}" class="timeline-view">${renderTimeline(modules)}</div>
  </div>`;
}

// ─────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────

async function init() {
  const nav  = document.getElementById('tabs-nav');
  const main = document.getElementById('main-content');

  nav.innerHTML = SHEETS_CONFIG.map((s, i) =>
    `<button class="tab-btn${i === 0 ? ' active' : ''}" data-id="${s.id}">${s.label}</button>`
  ).join('');

  const allData = await Promise.all(SHEETS_CONFIG.map(loadSheet));
  main.innerHTML = SHEETS_CONFIG.map((s, i) => renderPanel(s, allData[i], i)).join('');

  // Tab switch
  nav.addEventListener('click', e => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    nav.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    main.querySelectorAll('.formation-panel').forEach(p => p.classList.remove('active'));
    main.querySelector(`#panel-${btn.dataset.id}`)?.classList.add('active');
  });

  // List ↔ Timeline toggle
  main.addEventListener('click', e => {
    const btn = e.target.closest('.view-btn');
    if (!btn) return;
    const { view, panel } = btn.dataset;
    btn.closest('.view-toggle').querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`list-${panel}`).style.display     = view === 'list'     ? '' : 'none';
    document.getElementById(`timeline-${panel}`).style.display = view === 'timeline' ? 'block' : 'none';
  });
}

init();
</script>
